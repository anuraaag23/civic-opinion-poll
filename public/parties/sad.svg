<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- SAD Weighing Scales Official Symbol -->
  <rect width="512" height="512" rx="48" fill="#1e3a8a"/>
  <!-- Central Beam & Stand -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="90" x2="256" y2="400" stroke-width="18"/>
    <!-- Top ring -->
    <circle cx="256" cy="80" r="22" stroke-width="12"/>
    <!-- Horizontal Beam -->
    <line x1="100" y1="170" x2="412" y2="170" stroke-width="18"/>
    <!-- Stand Base -->
    <path d="M180 440 L256 400 L332 440 Z" fill="#ffffff" stroke-width="6"/>
    <!-- Left Scale Strings & Pan -->
    <line x1="100" y1="170" x2="60" y2="280" stroke-width="8"/>
    <line x1="100" y1="170" x2="140" y2="280" stroke-width="8"/>
    <path d="M50 280 Q100 330 150 280 Z" fill="#ffffff" stroke-width="8"/>
    <!-- Right Scale Strings & Pan -->
    <line x1="412" y1="170" x2="372" y2="280" stroke-width="8"/>
    <line x1="412" y1="170" x2="452" y2="280" stroke-width="8"/>
    <path d="M362 280 Q412 330 462 280 Z" fill="#ffffff" stroke-width="8"/>
  </g>
</svg>
