<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- JSP (Jana Sena Party) Glass Tumbler & Emblem -->
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  <circle cx="256" cy="256" r="230" fill="#fef2f2" stroke="#dc2626" stroke-width="8"/>
  <g transform="translate(256, 256)">
    <!-- Red Star Emblem at top -->
    <polygon points="0,-170 20,-130 65,-125 30,-95 40,-50 0,-75 -40,-50 -30,-95 -65,-125 -20,-130" fill="#dc2626"/>
    <!-- Glass Tumbler (Official ECI Symbol) -->
    <!-- Glass body -->
    <path d="M-75 -30 L-50 160 C-50 175 50 175 50 160 L75 -30 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="12" stroke-linejoin="round"/>
    <!-- Glass Rim -->
    <ellipse cx="0" cy="-30" rx="75" ry="16" fill="#bae6fd" stroke="#0284c7" stroke-width="10"/>
    <!-- Water level line inside tumbler -->
    <ellipse cx="0" cy="30" rx="66" ry="14" fill="#38bdf8" fill-opacity="0.5" stroke="#0284c7" stroke-width="6"/>
    <!-- Glass Base -->
    <ellipse cx="0" cy="160" rx="50" ry="12" fill="#bae6fd" stroke="#0284c7" stroke-width="10"/>
  </g>
</svg>
