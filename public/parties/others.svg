<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <circle cx="50" cy="50" r="44" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Ballot Box Body -->
  <rect x="26" y="44" width="48" height="36" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <rect x="32" y="50" width="36" height="24" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

  <!-- Ballot Box Lid -->
  <rect x="22" y="39" width="56" height="8" rx="2" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="38" y="41.5" width="24" height="3" rx="1.5" fill="#0f172a"/>

  <!-- Ballot Paper Slotted In -->
  <rect x="37" y="16" width="26" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="41" y1="21" x2="59" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="25" x2="59" y2="25" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Green Vote Checkmark -->
  <path d="M44 32 L48 36 L55 28" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- OTH Monogram -->
  <text x="50" y="66" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="1">OTH</text>
</svg>
