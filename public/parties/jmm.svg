<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- JMM Bow and Arrow Official Symbol -->
  <rect width="512" height="512" rx="48" fill="#15803d"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="12"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bow -->
    <path d="M140 110 C270 140 270 372 140 402" stroke-width="24"/>
    <line x1="140" y1="110" x2="140" y2="402" stroke-width="8"/>
    <!-- Arrow -->
    <line x1="100" y1="256" x2="400" y2="256" stroke-width="18"/>
    <!-- Arrow Head -->
    <polygon points="400,256 330,210 350,256 330,302" fill="#ffffff" stroke="none"/>
    <polygon points="100,256 70,226 85,256 70,286" fill="#ffffff" stroke="none"/>
  </g>
</svg>
