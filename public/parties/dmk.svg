<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- DMK Rising Sun Official Symbol -->
  <rect width="512" height="256" fill="#dc2626"/>
  <rect y="256" width="512" height="256" fill="#0f172a"/>
  <!-- Sun and rays -->
  <g transform="translate(256, 260)">
    <!-- Sun disk -->
    <path d="M-90 0 A90 90 0 0 1 90 0 Z" fill="#facc15" stroke="#ca8a04" stroke-width="6"/>
    <!-- Rising sun rays -->
    <line x1="0" y1="-95" x2="0" y2="-175" stroke="#facc15" stroke-width="16" stroke-linecap="round"/>
    <line x1="-38" y1="-88" x2="-75" y2="-165" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <line x1="38" y1="-88" x2="75" y2="-165" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <line x1="-70" y1="-65" x2="-135" y2="-130" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <line x1="70" y1="-65" x2="135" y2="-130" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <line x1="-90" y1="-30" x2="-165" y2="-65" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <line x1="90" y1="-30" x2="165" y2="-65" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <!-- Twin mountains -->
    <polygon points="-256,120 -110,-20 0,60" fill="#1e293b"/>
    <polygon points="0,60 110,-20 256,120" fill="#0f172a"/>
  </g>
</svg>
