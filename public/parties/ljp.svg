<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- LJP (Ram Vilas) Helicopter Official Symbol -->
  <rect width="512" height="512" rx="48" fill="#1e3a8a"/>
  <g fill="#ffffff" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Rotor Blades at top -->
    <line x1="60" y1="130" x2="430" y2="130" stroke="#ffffff" stroke-width="16"/>
    <!-- Rotor Shaft / Mast -->
    <rect x="236" y="130" width="20" height="40" fill="#ffffff" stroke="none"/>
    <!-- Helicopter Fuselage (Cabin & Cockpit) -->
    <path d="M140 280 C120 280 100 250 120 210 C140 170 200 170 270 170 C340 170 380 200 370 260 C360 290 320 295 240 295 Z" fill="#ffffff" stroke-width="10"/>
    <!-- Cockpit Windshield (Blue glass) -->
    <path d="M135 220 C145 190 180 185 220 185 L220 235 L145 245 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="4"/>
    <!-- Tail Boom extending to right -->
    <path d="M360 230 L450 200 L450 215 L360 250 Z" fill="#ffffff" stroke-width="6"/>
    <!-- Tail Fin (Vertical Stabilizer) & Tail Rotor -->
    <polygon points="440,215 470,165 480,170 455,220" fill="#ffffff" stroke-width="4"/>
    <line x1="470" y1="150" x2="470" y2="210" stroke="#ffffff" stroke-width="8"/>
    <!-- Landing Skids (Legs & Rails) -->
    <!-- Struts -->
    <line x1="180" y1="290" x2="160" y2="350" stroke="#ffffff" stroke-width="12"/>
    <line x1="300" y1="290" x2="280" y2="350" stroke="#ffffff" stroke-width="12"/>
    <!-- Horizontal Skid Bar with curved front -->
    <path d="M110 330 C110 350 130 350 140 350 L340 350 C360 350 370 340 370 340" fill="none" stroke="#ffffff" stroke-width="16"/>
  </g>
</svg>
